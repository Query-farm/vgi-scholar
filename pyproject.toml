[project]
name = "vgi-scholar"
version = "0.1.0"
description = "Search scholarly literature (OpenAlex / arXiv / Crossref) from SQL as VGI DuckDB table functions"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Query Farm LLC", email = "hello@query.farm" }]
keywords = [
    "vgi",
    "duckdb",
    "scholarly",
    "openalex",
    "arxiv",
    "crossref",
    "literature-search",
    "research",
    "rag",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    # vgi-python 0.16.x emits the current table-listing wire schema
    # (required_filters). The currently released signed `vgi` community extension
    # — the one the vgi-lint action and the haybarn SQL E2E both `INSTALL vgi FROM
    # community` at runtime — has been rebuilt to expect exactly that schema, so a
    # browsable Table (scholar_providers) ATTACHes cleanly at 0.16.x. Do NOT pin
    # below 0.16.0: the current community extension rejects the older
    # required_field_filter_paths / 31-field schema earlier releases emit.
    "vgi-python>=0.16.0",
    "httpx>=0.27",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pydoclint>=0.5",
]
# HTTP transport: the worker can serve over HTTP (`scholar_worker.py --http`, and
# the HTTP entry `serve.py`) in addition to stdio/AF_UNIX. That path needs
# vgi-python's `http` extra (waitress). CI's http transport leg installs this via
# `uv sync --extra http`.
http = [
    # Keep the floor in lockstep with the base `vgi-python` dependency above.
    "vgi-python[http]>=0.16.0",
]
# Alias of `http` used by the Docker image (`pip install '.[serve]'`) to install
# the HTTP-serving stack (vgi-python's waitress-backed `http` extra). Kept in
# lockstep with the `http` extra and the base `vgi-python` floor above.
serve = ["vgi-python[http]>=0.16.0"]

[project.scripts]
# Console script so DuckDB can spawn the worker by name (and the Docker image's
# stdio transport can `exec vgi-scholar-worker`). Points at the wheel-importable
# worker main; `scholar_worker.py` is a thin PEP-723 shim re-exporting the same.
vgi-scholar-worker = "vgi_scholar.worker:main"

[project.urls]
Homepage = "https://query.farm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgi_scholar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.per-file-ignores]
# Docstrings (D) are enforced on the worker package/scripts (product code), not tests.
"tests/**" = ["D"]
# The PEP 723 inline-script headers wrap dependency pins that should stay one-per-line.
"scholar_worker.py" = ["E501"]
"serve.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pydoclint]
# Docstring consistency gate (complements ruff's D rules: ruff checks docstring
# shape, pydoclint checks documented args/returns/attrs match the code).
style = "google"
arg_type_hints_in_docstring = false
check_return_types = false
check_yield_types = false
check_class_attributes = true
skip_checking_raises = true
allow_init_docstring = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
