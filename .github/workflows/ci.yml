# Copyright 2026 Query Farm LLC - https://query.farm
#
# Unit tests (pytest), lint, and the sqllogictest extension suite
# (test/sql/*.test) run against the vgi-scholar worker through the real signed
# `vgi` DuckDB community extension via a prebuilt standalone `haybarn-unittest`.
# The SQL E2E redirects every provider at a local in-process mock server — no
# keys, no cost, no live egress. See ci/README.md for the design.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow docker-publish.yml / release.yml to gate on this workflow.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SQL test runner, pinned; its haybarn 2.0 community `vgi` extension speaks
  # the worker's VGI protocol (vgi.v3).
  HAYBARN_VERSION: "2.0.1rc3"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run --no-sync pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy vgi_scholar scholar_worker.py serve.py

      - name: Docstring lint (pydoclint)
        run: uvx pydoclint --config pyproject.toml vgi_scholar scholar_worker.py serve.py

  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install the worker (from the lockfile, with the http extra)
        run: uv sync --frozen --python 3.14 --extra http

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # Run the worker via the synced project venv (locked vgi-python), NOT
          # `uv run scholar_worker.py`: the PEP-723 inline-script env caches a
          # stale SDK and can emit the old catalog schema, a false mismatch.
          location: ".venv/bin/python scholar_worker.py"
          fail-on: info

  # test/sql/*.test through DuckDB (the haybarn-unittest runner + the signed
  # community `vgi` extension) over every transport, via ci/run-integration.sh —
  # the same script `make test-sql` runs.
  integration:
    name: SQL E2E (${{ matrix.transport }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # launch: DuckDB starts the worker once on an AF_UNIX socket and pools it.
        transport: [stdio, launch, http]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - name: Build the worker
        run: uv sync --locked --all-extras
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          # ci/run-integration.sh starts the mock provider server (tests/mock_server.py)
          # for every transport, so nothing here reaches a live API.
          export WORKER="$PWD/.venv/bin/vgi-scholar-worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh
